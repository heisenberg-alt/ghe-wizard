name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for t in "${targets[@]}"; do
            os="${t%/*}"; arch="${t#*/}"
            out="ghe-wizard_${VERSION}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            echo "building $out$ext"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/${out}${ext}" ./cmd/ghe-wizard
            (cd dist && sha256sum "${out}${ext}" >> checksums.txt)
          done
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ghe-wizard_*
            dist/checksums.txt
