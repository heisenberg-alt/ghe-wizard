# Example workflow: generate a human-reviewed PR with a ghe-wizard remediation plan.
#
# Copy this file into .github/workflows/autofix-pr.yml in the repository where you
# want to record governance remediation plans. It does NOT apply settings changes.
# It only commits ghe-remediation-plan.md to a reusable branch and opens/updates a PR.
#
# Required configuration:
# - secrets.GHE_TOKEN: enterprise-admin-capable token for ghe-wizard API reads/writes.
# - vars.GHE_ENTERPRISE or secrets.GHE_ENTERPRISE: GitHub Enterprise slug/name.

name: GHE remediation plan PR

on:
  workflow_dispatch:
    inputs:
      enterprise:
        description: "Optional enterprise slug; defaults to vars.GHE_ENTERPRISE or secrets.GHE_ENTERPRISE"
        required: false
        type: string
      rules:
        description: "Optional comma-separated rule IDs to preview, for example ORG-04,SEC-03"
        required: false
        type: string
      image:
        description: "ghe-wizard container image"
        required: false
        default: ghcr.io/heisenberg-alt/ghe-wizard:latest
        type: string
  # Optional weekly drift check. Delete this block if you only want manual runs.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Generate remediation plan PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ghe-wizard apply --dry-run
        id: plan
        shell: bash
        env:
          # Keep secrets in environment variables consumed by the container.
          # The script intentionally never echoes these values.
          GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
          GHE_ENTERPRISE: ${{ inputs.enterprise || vars.GHE_ENTERPRISE || secrets.GHE_ENTERPRISE }}
          GHE_WIZARD_IMAGE: ${{ inputs.image || 'ghcr.io/heisenberg-alt/ghe-wizard:latest' }}
          RULES: ${{ inputs.rules }}
        run: |
          set -euo pipefail

          if [ -z "${GHE_TOKEN:-}" ]; then
            echo "::error::Configure secrets.GHE_TOKEN with an enterprise-admin-capable token."
            exit 1
          fi

          if [ -z "${GHE_ENTERPRISE:-}" ]; then
            echo "::error::Configure vars.GHE_ENTERPRISE, secrets.GHE_ENTERPRISE, or the workflow_dispatch enterprise input."
            exit 1
          fi

          raw_plan="${RUNNER_TEMP}/ghe-wizard-dry-run.raw.md"
          clean_plan="${RUNNER_TEMP}/ghe-wizard-dry-run.md"
          pr_body="${RUNNER_TEMP}/ghe-wizard-pr-body.md"
          generated_plan="ghe-remediation-plan.md"

          docker pull "${GHE_WIZARD_IMAGE}" >/dev/null

          docker_args=(
            run --rm
            -e GHE_TOKEN
            -e GHE_ENTERPRISE
            "${GHE_WIZARD_IMAGE}"
            apply
            --dry-run
          )

          if [ -n "${RULES:-}" ]; then
            docker_args+=(--rules "${RULES}")
          fi

          # Capture stdout to a file so proposed setting changes can be reviewed in a PR.
          # Do not enable shell tracing: it can expose secret-bearing environment details.
          docker "${docker_args[@]}" > "${raw_plan}"

          # Strip ANSI color codes if the CLI prints colored Markdown-ish output.
          perl -pe 's/\x1b\[[0-9;?]*[[:alpha:]]//g' "${raw_plan}" > "${clean_plan}"

          # ghe-wizard dry-run output is the source of truth. Treat empty output and
          # common no-op phrases as "already compliant"; otherwise keep humans in the loop.
          if [ ! -s "${clean_plan}" ] || grep -Eiq '^\s*(no (proposed )?(changes|fixes|remediations)|no remediable failing rules|nothing to (apply|remediate)|already compliant|0 (changes|fixes|remediations))\b' "${clean_plan}"; then
            rm -f "${generated_plan}"
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No proposed ghe-wizard remediations were found; the enterprise appears compliant for the selected rules."
            exit 0
          fi

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          {
            echo "# GHE Remediation Plan"
            echo
            echo "_Generated by \`ghe-wizard apply --dry-run\` at ${timestamp} UTC for the configured enterprise._"
            echo
            echo "> **Human approval required:** this file records proposed GitHub Enterprise governance settings changes only."
            echo "> ghe-wizard remediations change GitHub API settings such as org base permission, 2FA,"
            echo "> secret-scanning push protection, enterprise rulesets, and custom properties. They are not repository file edits."
            echo "> Nothing is applied by this workflow."
            echo
            echo "## Proposed changes"
            echo
            cat "${clean_plan}"
            echo
          } > "${generated_plan}"

          {
            echo "<!-- ghe-wizard-autofix -->"
            echo "## Proposed GHE governance remediations"
            echo
            echo "This PR records the latest \`ghe-wizard apply --dry-run\` remediation plan for human review."
            echo "It does **not** apply enterprise or organization settings changes."
            echo
            echo "### Reviewer checklist"
            echo
            echo "- [ ] Review every proposed GitHub API settings change in \`${generated_plan}\`."
            echo "- [ ] Confirm the token used to apply changes has least privilege and is approved for this enterprise."
            echo "- [ ] Apply only after approval by running \`ghe-wizard apply\` interactively, or \`ghe-wizard apply --rules ID,ID\` for selected rules."
            echo "- [ ] Re-run \`ghe-wizard assess --format md\` after applying to verify compliance."
            echo
            echo "## Embedded remediation plan"
            echo
            cat "${generated_plan}"
          } > "${pr_body}"

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "pr_body=${pr_body}" >> "${GITHUB_OUTPUT}"

      - name: Create or update remediation plan PR
        if: steps.plan.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: ghe-wizard/remediation-plan
          base: ${{ github.event.repository.default_branch }}
          title: "chore: proposed GHE governance remediations"
          commit-message: "chore: record proposed GHE governance remediations"
          body-path: ${{ steps.plan.outputs.pr_body }}
          add-paths: ghe-remediation-plan.md
          delete-branch: true

      - name: Log compliant state
        if: steps.plan.outputs.has_changes != 'true'
        run: echo "No PR created because ghe-wizard reported no proposed remediations."
